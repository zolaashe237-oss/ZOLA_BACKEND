<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1F2937"/>
    </marker>
    <marker id="arrow4red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FEFEFE"/>

  <text x="480" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#6B1E2F">
    Flux 3 — Admin ajoute une ressource vidéo (synchrone, fail-silent)
  </text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6B7280">
    Attaché à l'enregistrement d'une Resource dans un cours. NE bloque JAMAIS la sauvegarde en cas d'échec.
  </text>

  <!-- Étape 1 -->
  <rect x="280" y="80" width="400" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="480" y="105" font-size="14" font-weight="700" text-anchor="middle" fill="#1E3A8A">1. Admin remplit le formulaire Resource</text>
  <text x="480" y="127" font-size="11" text-anchor="middle" fill="#1F2937">avec un `youtube_url`, soumet</text>
  <text x="480" y="142" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" fill="#6B7280">POST /admin-api/resources/</text>

  <line x1="480" y1="150" x2="480" y2="180" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Étape 2 : views_content -->
  <rect x="280" y="180" width="400" height="70" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
  <text x="480" y="205" font-size="14" font-weight="700" text-anchor="middle" fill="#065F46">2. views_content.py:66</text>
  <text x="480" y="225" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1F2937">text = fetch_youtube_transcript(resource.youtube_url)</text>
  <text x="480" y="242" font-size="11" text-anchor="middle" fill="#6B7280">Appel SYNCHRONE (pendant la requête HTTP admin)</text>

  <line x1="480" y1="250" x2="480" y2="280" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Étape 3 : Wrapper -->
  <rect x="180" y="280" width="600" height="130" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="480" y="305" font-size="14" font-weight="700" text-anchor="middle" fill="#92400E">3. Wrapper `fetch_youtube_transcript` (fail-silent)</text>
  <text x="200" y="330" font-size="11" font-family="ui-monospace, monospace" fill="#1F2937">def fetch_youtube_transcript(url: str) -> str:</text>
  <text x="200" y="346" font-size="11" font-family="ui-monospace, monospace" fill="#1F2937">    if not url: return ""</text>
  <text x="200" y="362" font-size="11" font-family="ui-monospace, monospace" fill="#1F2937">    try:</text>
  <text x="200" y="378" font-size="11" font-family="ui-monospace, monospace" fill="#1F2937">        return extract_youtube_transcript(url)   # peut lever TranscriptNotAvailable</text>
  <text x="200" y="394" font-size="11" font-family="ui-monospace, monospace" fill="#DC2626">    except Exception: logger.debug(...); return ""</text>

  <!-- Chemin succès -->
  <line x1="330" y1="410" x2="230" y2="470" stroke="#059669" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="60" y="470" width="340" height="90" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
  <text x="230" y="494" font-size="13" font-weight="700" text-anchor="middle" fill="#065F46">SUCCÈS</text>
  <text x="230" y="514" font-size="11" text-anchor="middle" fill="#1F2937">Resource.transcript = &lt;texte extrait&gt;</text>
  <text x="230" y="530" font-size="11" text-anchor="middle" fill="#1F2937">Resource sauvegardée en base</text>
  <text x="230" y="548" font-size="11" text-anchor="middle" fill="#6B7280">Utilisable pour recherche/IA</text>

  <!-- Chemin échec -->
  <line x1="630" y1="410" x2="730" y2="470" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow4red)"/>
  <rect x="560" y="470" width="340" height="90" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="730" y="494" font-size="13" font-weight="700" text-anchor="middle" fill="#991B1B">ÉCHEC (silencieux)</text>
  <text x="730" y="514" font-size="11" text-anchor="middle" fill="#1F2937">Resource.transcript = ""</text>
  <text x="730" y="530" font-size="11" text-anchor="middle" fill="#1F2937">Resource sauvegardée QUAND MÊME</text>
  <text x="730" y="548" font-size="11" text-anchor="middle" fill="#6B7280">Log DEBUG, admin peut remplir à la main</text>

  <!-- Note -->
  <rect x="60" y="585" width="840" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="480" y="604" font-size="11" text-anchor="middle" fill="#92400E" font-weight="600">
    Design volontaire : la création de contenu admin doit rester rapide et robuste. Le transcript est un bonus, pas un bloqueur.
  </text>
</svg>
