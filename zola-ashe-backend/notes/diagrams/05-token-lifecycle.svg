<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1F2937"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FEFEFE"/>

  <text x="480" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#6B1E2F">
    Cycle de vie des 2 tokens OAuth
  </text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6B7280">
    Différence entre refresh_token (long) et access_token (court) — pourquoi on n'utilise QUE refresh dans .env
  </text>

  <!-- Colonne refresh_token -->
  <rect x="40" y="90" width="410" height="480" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="245" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#5B21B6">🔑 refresh_token</text>
  <text x="245" y="140" font-size="12" text-anchor="middle" fill="#374151">Le seul stocké en .env</text>

  <rect x="70" y="160" width="350" height="60" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="245" y="182" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">Durée de vie</text>
  <text x="245" y="200" font-size="11" text-anchor="middle" fill="#059669">Permanent (app publiée)</text>
  <text x="245" y="214" font-size="11" text-anchor="middle" fill="#DC2626">7 jours (app en Testing) ⚠</text>

  <rect x="70" y="240" width="350" height="60" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="245" y="262" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">Où est-il stocké ?</text>
  <text x="245" y="282" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1F2937">.env → YOUTUBE_OAUTH_REFRESH_TOKEN</text>

  <rect x="70" y="320" width="350" height="60" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="245" y="342" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">À quoi il sert ?</text>
  <text x="245" y="362" font-size="11" text-anchor="middle" fill="#1F2937">Générer un access_token à chaque appel API</text>

  <rect x="70" y="400" width="350" height="60" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="245" y="422" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">Combien de fois généré ?</text>
  <text x="245" y="442" font-size="11" text-anchor="middle" fill="#059669">Une seule fois (bootstrap)</text>

  <rect x="70" y="480" width="350" height="70" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="245" y="502" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">Sécurité</text>
  <text x="245" y="522" font-size="11" text-anchor="middle" fill="#DC2626">Ne JAMAIS commiter en git</text>
  <text x="245" y="538" font-size="11" text-anchor="middle" fill="#374151">.env est dans .gitignore</text>

  <!-- Flèche milieu : refresh() -->
  <path d="M 450,300 Q 480,300 480,300" fill="none" stroke="#1F2937" stroke-width="0"/>
  <line x1="450" y1="300" x2="510" y2="300" stroke="#1F2937" stroke-width="2.5" marker-end="url(#arrow5)"/>
  <text x="480" y="285" font-size="11" font-weight="600" text-anchor="middle" fill="#059669">creds.refresh()</text>
  <text x="480" y="320" font-size="10" text-anchor="middle" fill="#6B7280">POST /token</text>

  <!-- Colonne access_token -->
  <rect x="510" y="90" width="410" height="480" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="715" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#1E3A8A">🎫 access_token</text>
  <text x="715" y="140" font-size="12" text-anchor="middle" fill="#374151">Éphémère, en mémoire seulement</text>

  <rect x="540" y="160" width="350" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="715" y="182" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">Durée de vie</text>
  <text x="715" y="200" font-size="11" text-anchor="middle" fill="#DC2626">1 heure (fixe côté Google)</text>
  <text x="715" y="214" font-size="10" text-anchor="middle" fill="#6B7280">après on doit le renouveler</text>

  <rect x="540" y="240" width="350" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="715" y="262" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">Où est-il stocké ?</text>
  <text x="715" y="282" font-size="11" text-anchor="middle" fill="#1F2937">Nulle part — variable Python locale</text>

  <rect x="540" y="320" width="350" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="715" y="342" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">À quoi il sert ?</text>
  <text x="715" y="362" font-size="11" text-anchor="middle" fill="#1F2937">Bearer sur chaque call captions.list/download</text>

  <rect x="540" y="400" width="350" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="715" y="422" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">Combien de fois généré ?</text>
  <text x="715" y="442" font-size="11" text-anchor="middle" fill="#2563EB">Une fois par appel extract_youtube_transcript</text>

  <rect x="540" y="480" width="350" height="70" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="715" y="502" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2937">Sécurité</text>
  <text x="715" y="522" font-size="11" text-anchor="middle" fill="#059669">Court → risque si fuite : ≤ 1h</text>
  <text x="715" y="538" font-size="11" text-anchor="middle" fill="#374151">Jamais transmis au frontend</text>

  <text x="480" y="600" font-size="12" text-anchor="middle" fill="#6B7280" font-style="italic">
    C'est pour ça qu'on stocke seulement le refresh_token : on peut toujours régénérer l'access_token quand on veut.
  </text>
</svg>
