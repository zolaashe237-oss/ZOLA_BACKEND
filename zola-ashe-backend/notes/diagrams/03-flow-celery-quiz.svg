<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1F2937"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FEFEFE"/>

  <text x="480" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#6B1E2F">
    Flux 2 — Génération de quiz YouTube (Celery)
  </text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6B7280">
    Bout-en-bout : de la création du QuizJob (admin) jusqu'au QCM généré par Gemini
  </text>

  <!-- ÉTAPE 1 : Admin crée QuizJob -->
  <rect x="330" y="80" width="300" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="480" y="105" font-size="14" font-weight="700" text-anchor="middle" fill="#1E3A8A">1. Admin crée un QuizJob</text>
  <text x="480" y="125" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1F2937">source_type = VIDEO_YOUTUBE</text>
  <text x="480" y="140" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1F2937">source_ref  = https://youtu.be/ABC123</text>

  <line x1="480" y1="150" x2="480" y2="180" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- ÉTAPE 2 : Celery worker -->
  <rect x="330" y="180" width="300" height="60" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
  <text x="480" y="205" font-size="14" font-weight="700" text-anchor="middle" fill="#065F46">2. Celery worker consume la tâche</text>
  <text x="480" y="225" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1F2937">generate_quiz_task.delay(job_id)</text>

  <line x1="480" y1="240" x2="480" y2="270" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- ÉTAPE 3 : _resolve_source_text -->
  <rect x="330" y="270" width="300" height="70" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
  <text x="480" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#065F46">3. _resolve_source_text(job)</text>
  <text x="480" y="315" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1F2937">apps/ai_quiz/tasks.py:142</text>
  <text x="480" y="330" font-size="11" text-anchor="middle" fill="#6B7280">→ dispatch selon source_type</text>

  <line x1="480" y1="340" x2="480" y2="370" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- ÉTAPE 4 : extract_youtube_transcript -->
  <rect x="230" y="370" width="500" height="90" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="480" y="394" font-size="15" font-weight="700" text-anchor="middle" fill="#92400E">4. extract_youtube_transcript(url) — le cœur</text>
  <text x="480" y="414" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1F2937">apps/ai_quiz/extractors/youtube.py:56</text>
  <text x="480" y="434" font-size="11" text-anchor="middle" fill="#374151">4 sous-étapes : (a) build_service  →  (b) captions.list  →  (c) captions.download  →  (d) srt→text</text>
  <text x="480" y="450" font-size="10" text-anchor="middle" fill="#DC2626">
    Toute exception ci-dessous devient TranscriptNotAvailable  →  job.status = FAILED
  </text>

  <!-- ÉTAPE 4a : build service -->
  <rect x="40" y="490" width="220" height="90" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="150" y="510" font-size="12" font-weight="600" text-anchor="middle" fill="#92400E">4a. _build_youtube_service</text>
  <text x="150" y="528" font-size="10" text-anchor="middle" fill="#374151">Lit 3 vars depuis settings</text>
  <text x="150" y="542" font-size="10" text-anchor="middle" fill="#374151">Credentials(refresh_token=…)</text>
  <text x="150" y="556" font-size="10" text-anchor="middle" fill="#059669">.refresh(Request())</text>
  <text x="150" y="572" font-size="10" text-anchor="middle" fill="#6B7280">→ access_token frais (1h)</text>

  <!-- ÉTAPE 4b : captions.list -->
  <rect x="270" y="490" width="220" height="90" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="380" y="510" font-size="12" font-weight="600" text-anchor="middle" fill="#92400E">4b. captions.list</text>
  <text x="380" y="528" font-size="10" text-anchor="middle" fill="#374151">youtube.captions().list(</text>
  <text x="380" y="542" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle" fill="#374151">videoId=id, part="id,snippet")</text>
  <text x="380" y="562" font-size="10" text-anchor="middle" fill="#374151">_pick_caption_track :</text>
  <text x="380" y="576" font-size="10" text-anchor="middle" fill="#059669">FR → EN → 1ère dispo</text>

  <!-- ÉTAPE 4c : captions.download -->
  <rect x="500" y="490" width="220" height="90" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="610" y="510" font-size="12" font-weight="600" text-anchor="middle" fill="#92400E">4c. captions.download</text>
  <text x="610" y="528" font-size="10" text-anchor="middle" fill="#374151">youtube.captions().download(</text>
  <text x="610" y="542" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle" fill="#374151">id=caption_id, tfmt="srt")</text>
  <text x="610" y="562" font-size="10" text-anchor="middle" fill="#374151">→ bytes SRT</text>
  <text x="610" y="578" font-size="10" text-anchor="middle" fill="#DC2626">⚠ 403 si non-propriétaire</text>

  <!-- ÉTAPE 4d : srt→text -->
  <rect x="730" y="490" width="200" height="90" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="830" y="510" font-size="12" font-weight="600" text-anchor="middle" fill="#92400E">4d. _srt_to_plain_text</text>
  <text x="830" y="528" font-size="10" text-anchor="middle" fill="#374151">Retire les index numérotés,</text>
  <text x="830" y="542" font-size="10" text-anchor="middle" fill="#374151">les timings 00:00:00,000 -->,</text>
  <text x="830" y="556" font-size="10" text-anchor="middle" fill="#374151">les tags &lt;c&gt;/[Musique],</text>
  <text x="830" y="572" font-size="10" text-anchor="middle" fill="#059669">joint tout en une string</text>

  <!-- Flèches 4a → 4b → 4c → 4d -->
  <line x1="260" y1="535" x2="266" y2="535" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="490" y1="535" x2="496" y2="535" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="720" y1="535" x2="726" y2="535" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Convergence vers étape 5 -->
  <line x1="480" y1="580" x2="480" y2="610" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- ÉTAPE 5 : Gemini -->
  <rect x="280" y="610" width="400" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="480" y="635" font-size="14" font-weight="700" text-anchor="middle" fill="#5B21B6">5. Appel Gemini (agent IA)</text>
  <text x="480" y="655" font-size="11" text-anchor="middle" fill="#1F2937">transcript → prompt → gemini-2.5-flash → QCM structuré JSON</text>
  <text x="480" y="670" font-size="11" text-anchor="middle" fill="#6B7280">apps/ai_quiz/services.py + Gemini API</text>

  <line x1="480" y1="680" x2="480" y2="710" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- ÉTAPE 6 : QCM persisté -->
  <rect x="330" y="710" width="300" height="55" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
  <text x="480" y="734" font-size="14" font-weight="700" text-anchor="middle" fill="#065F46">6. QuizJob.status = SUCCESS</text>
  <text x="480" y="754" font-size="11" text-anchor="middle" fill="#1F2937">Quiz + Questions + Choices persistés en DB</text>
</svg>
